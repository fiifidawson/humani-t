# The web app's quality gates. Each check is its own job, so branch protection can
# require each one by name and a failure says which gate it was.

name: web

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: web (${{ matrix.task }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # check:api fails when services/api/openapi.json or the generated
        # TypeScript types no longer match the API's code.
        task: [lint, typecheck, test, build, "check:api"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      # check:api exports the OpenAPI document from the API's own code.
      - if: matrix.task == 'check:api'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install (exactly what pnpm-lock.yaml says)
        run: pnpm install --frozen-lockfile

      - name: pnpm ${{ matrix.task }}
        run: pnpm run "$TASK"
        env:
          TASK: ${{ matrix.task }}
