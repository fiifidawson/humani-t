name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. **Security problems go through private reporting, not here** (see SECURITY.md).

        Use fictional data only. Never paste real names, documents, questions or anything from a real review into an issue: issues are public and permanent.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or requests that shows the problem.
      placeholder: |
        1. docker compose -f compose.dev.yaml up -d
        2. POST /api/v1/...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and responses
      description: The response body and the API log line, with its request id. Remove anything that looks like a token, password or cookie.
      render: text

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where
      options:
        - Development (API on the host, compose.dev.yaml)
        - Self-hosted stack (compose.yaml)
        - CI
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system and Docker version
      placeholder: Windows 11, Docker Desktop 4.x
