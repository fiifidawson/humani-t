# Dependabot opens pull requests that update dependencies; CI then decides whether
# they are safe to merge. Updates are grouped, so a week of patch releases is one
# pull request to review instead of twenty.
#
# The cooldown waits a few days after a release before proposing it. Most
# malicious releases (a hijacked maintainer account publishing a poisoned
# version) are found and pulled within that window, before they reach us.
# Security updates ignore the cooldown and arrive at once.

# Updates go to staging like any other change, and reach main only when staging
# is promoted. Dependabot reads this file from the default branch (main), so a
# change here takes effect once it is there. Security updates ignore target-branch
# and open against main; change their base to staging before merging.

version: 2

updates:
  - package-ecosystem: uv
    target-branch: staging
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm # pnpm workspaces are handled by the npm ecosystem
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore(deps)
    groups:
      javascript:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    target-branch: staging
    directories:
      - /services/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # CLAUDE.md targets Python 3.13; moving to 3.14 is a decision, not an update.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
      # Stay on the active LTS line of Node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    groups:
      service-images:
        patterns: ["*"]
    ignore:
      # A new Postgres major version cannot open the old one's data directory:
      # it needs a dump and restore (docs/deploy/self-hosting.md, "Upgrades").
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: valkey/valkey
        update-types: ["version-update:semver-major"]
