# clamd for the `clamav` service in compose.yaml (profile malware-scan, ADR 0012).
# Mounted read-only; the image's own /init, which edits its config files as root,
# is not used. Only the worker can reach port 3310, and it sends raw uploads here.

Foreground yes
LogTime yes

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
TCPSocket 3310

# Re-reads the database when freshclam, in its own container, has changed it.
# There is no NotifyClamd: freshclam has no route to this container.
SelfCheck 600
# One engine in memory, not two: scans wait for the few seconds a reload takes,
# and clamd needs about half the memory it would otherwise.
ConcurrentDatabaseReload no

# Keep this at least HUMANI_T_UPLOAD_MAX_BYTES (20 MiB by default); a larger
# upload fails as scan_failed. Raise it with that setting and Caddy's limit.
StreamMaxLength 25M
# A file too deep or too large to scan whole is reported, not passed as clean.
AlertExceedsMax yes

# Nothing that talks to clamd may stop it or force a reload.
EnableShutdownCommand no
EnableReloadCommand no
EnableStatsCommand no
