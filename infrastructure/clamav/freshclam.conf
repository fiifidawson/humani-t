# freshclam for the `freshclam` service in compose.yaml (profile malware-scan,
# ADR 0012). It downloads ClamAV's signatures into the shared volume; it never
# sees an uploaded file, and clamd never has a route to the internet.

Foreground yes
LogTime yes

DatabaseDirectory /var/lib/clamav
# ClamAV's own CDN. The request carries freshclam's version and the database
# versions it holds, nothing from humani-t. ClamAV asks for at most one check an
# hour; 12 a day is every two hours.
DatabaseMirror database.clamav.net
Checks 12
# Small daily differences instead of whole databases.
ScriptedUpdates yes
