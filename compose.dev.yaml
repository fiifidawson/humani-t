# Development backing services. The API runs on the host with uv; these are what
# it talks to. For the full self-hosted stack, use compose.yaml instead.
#
#   python scripts/dev_secrets.py                  # once: ./secrets/* and services/api/.env
#   docker compose -f compose.dev.yaml up -d
#
# Ports are bound to 127.0.0.1 only, and are not the defaults (5432, 6379), so a
# Postgres or Redis already on the machine is untouched. services/api/.env points
# at these exact ports.
#
# The project name, service names and volume name are fixed: existing development
# data lives in the volume `humani-t_postgres-data`, and renaming any of them would
# start an empty database next to it.
name: humani-t

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    <<: *hardened
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    # The image's own `postgres` user. Starting as it, rather than as root and
    # stepping down, means the container never needs CHOWN, SETUID or SETGID.
    user: "70:70"
    environment:
      POSTGRES_DB: humani_t
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      # Also create humani_t_test, for the Postgres contract tests, which delete
      # what they write. Read only on the volume's first start.
      CREATE_TEST_DATABASE: "true"
    secrets:
      - db_superuser_password
      - db_migrator_password
      - db_app_password
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=0775,size=1m
      - /tmp:uid=70,gid=70,size=64m
    shm_size: 256m
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d humani_t"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g, pids: 512 }

  valkey:
    <<: *hardened
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    user: "999:1000"
    # The password goes in through standard input (`-` reads configuration from
    # it), never as an argument, where `ps` would show it. No persistence.
    command:
      - sh
      - -c
      - |
        exec valkey-server - --save "" --appendonly no --maxmemory 192mb --maxmemory-policy noeviction <<EOF
        requirepass $$(cat /run/secrets/valkey_password)
        EOF
    secrets:
      - valkey_password
    tmpfs:
      - /tmp:size=1m
      - /data:uid=999,gid=1000,size=1m
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m, pids: 128 }

  # Catches every email the API sends and shows it at http://127.0.0.1:58025.
  # Nothing is delivered to real addresses.
  mailpit:
    <<: *hardened
    image: axllent/mailpit:v1.27.11@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    user: "10001:10001"
    tmpfs:
      - /tmp:uid=10001,gid=10001,size=64m
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m, pids: 64 }

secrets:
  db_superuser_password:
    file: ./secrets/db_superuser_password
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_app_password:
    file: ./secrets/db_app_password
  valkey_password:
    file: ./secrets/valkey_password

volumes:
  postgres-data:
